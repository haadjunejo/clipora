<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b11">
<title>Clipora — AI Video Studio</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anton&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<script>
  // apply the saved theme before first paint (no flash)
  (function () {
    var t = null;
    try { t = new URLSearchParams(location.search).get("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = null;
    try { t = t || localStorage.getItem("clipora-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div class="boot" id="boot"><svg class="mark" viewBox="0 0 40 40"><use href="#logo-mark"/></svg></div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><use href="#logo-mark"/></svg>
      <span class="wordmark">clip<b>ora</b></span>
    </a>
    <div class="nav-label">Studio</div>
    <nav class="nav" id="sideNav"></nav>
    <div class="nav-label">Publish</div>
    <nav class="nav" id="sideNav2"></nav>
    <div class="side-bottom">
      <div class="server-card" id="serverCard"></div>
      <div class="profile">
        <div class="avatar" id="avatar">C</div>
        <div class="grow"><strong id="studioName">My studio</strong><small>Personal workspace</small></div>
        <button class="icon-btn sm flat" id="themeBtn2" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open menu"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <button class="search-trigger" id="paletteBtn" aria-label="Search and commands"></button>
        <span class="chip desk-only" id="topStatus"></span>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
        <a class="btn primary desk-only" href="#/" id="newBtn"></a>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="layer"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg-a" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4A8FF"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B2FD6"/>
    </linearGradient>
    <linearGradient id="lg-b" x1="22" y1="6" x2="36" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CE8FF"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <symbol id="logo-mark" viewBox="0 0 40 40">
      <rect x="1" y="1" width="38" height="38" rx="12" fill="url(#lg-a)"/>
      <rect x="1" y="1" width="38" height="38" rx="12" fill="url(#lg-b)" opacity=".55"/>
      <rect x="1.5" y="1.5" width="37" height="37" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".28"/>
      <path d="M27.6 26.4A10 10 0 1 1 27.6 13.6" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M17.2 15.6v8.8a.8.8 0 0 0 1.2.7l7-4.4a.8.8 0 0 0 0-1.4l-7-4.4a.8.8 0 0 0-1.2.7Z" fill="#fff"/>
      <path d="M31 6.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#fff"/>
    </symbol>
  </defs>
</svg>

<script src="js/core.js"></script>
<script src="js/pages.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
